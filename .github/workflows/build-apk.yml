name: Build Tashteeb 160 APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=EG"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Tashteeb160.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tashteeb160-APK
          path: Tashteeb160.apk

      - name: Publish Direct APK Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          gh release delete "$TAG" --yes || true
          git push origin ":refs/tags/$TAG" || true
          gh release create "$TAG" Tashteeb160.apk \
            --title "تشطيب 160 - ملف APK جاهز للتثبيت" \
            --notes "اضغط على ملف Tashteeb160.apk بالأسفل لتحميله وتثبيته مباشرة على هاتفك الأندرويد."
